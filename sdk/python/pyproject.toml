[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniswitch-sdk"
version = "0.1.0"
description = "Python client for the OmniSwitch payment gateway API — HMAC request signing, idempotency-key handling, and outbound webhook signature verification. Mirrors sdk/node's contract."
requires-python = ">=3.9"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
