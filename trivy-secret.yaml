allow-rules:
  - id: known-test-placeholders
    description: >-
      Known local dev/e2e test placeholder values — never real credentials.
      See docker-compose.yml's own comment on STRIPE_SECRET_KEY and
      test/setup-env.ts's header comment for why these exact strings are
      hardcoded. Scoped by exact regex, not by path or rule-wide disable,
      so a real credential dropped anywhere (including these same files)
      still gets caught.
    regex: 'sk_test_(e2e_)?placeholder'
