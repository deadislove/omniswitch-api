### Local-dev Prometheus config for docker-compose.yml's `prometheus` service.
### Scrapes the same GET /metrics endpoint k8s/deployment.yaml's
### prometheus.io/* annotations point a real cluster's Prometheus at (see
### src/observability/metrics.controller.ts) — this lets the alert rules in
### alert.rules.yml be verified against real firing conditions locally
### (force an outbox failure, force a circuit breaker open, etc.) instead
### of only reviewed by eye.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: omniswitch-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
