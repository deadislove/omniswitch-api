  '''sk_test_e2e_placeholder''',
  '''whsec_e2e_test_placeholder''',
  '''adyen_e2e_test_placeholder''',
  '''00112233445566778899aabbccddeeff00112233445566778899aabbccddee''',
  '''test-idempotency-key-12345''',
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
]
