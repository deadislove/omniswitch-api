name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR when a new push
# supersedes it, instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches Dockerfile's node:20-alpine base — see that file's three build
  # stages (deps/builder/production).
  NODE_VERSION: '20'

jobs:
  build-and-unit-test:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Blocking: `.prettierrc` (single-quote, matching this codebase's
      # actual convention) and `tsconfig.eslint.json` (extends the build
      # tsconfig with test/**/*.ts included, so type-aware rules can
      # parse test files without touching tsconfig.json's own `exclude`,
      # which is load-bearing for `nest build` — see eslint.config.cjs's
      # own comment) closed the two gaps that used to make a strict,
      # no-fix lint run fail on ~10k pre-existing findings. A clean
      # `eslint --fix` pass now reports zero problems.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

  e2e:
    name: E2E tests (full Docker stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Same services + same host-mapped ports (15432/5433/16379/8200/4000)
      # that test/setup-env.ts's defaults assume — this is the exact
      # workflow documented there and in README's Quick Start, just run
      # on a GitHub-hosted runner instead of a laptop. `api` itself is
      # deliberately excluded: the e2e suite talks to a Nest app started
      # in-process by Jest/Supertest, not to the containerized api service.
      - name: Start infrastructure (Postgres, Redis, Vault, mock-psp)
        run: |
          docker compose up -d --wait \
            postgres-master postgres-replica redis vault mock-psp

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v
