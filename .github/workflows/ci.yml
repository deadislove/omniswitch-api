name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same branch/PR when a new push
# supersedes it, instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches Dockerfile's node:20-alpine base — see that file's three build
  # stages (deps/builder/production).
  NODE_VERSION: '20'

jobs:
  build-and-unit-test:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Blocking: `.prettierrc` (single-quote, matching this codebase's
      # actual convention) and `tsconfig.eslint.json` (extends the build
      # tsconfig with test/**/*.ts included, so type-aware rules can
      # parse test files without touching tsconfig.json's own `exclude`,
      # which is load-bearing for `nest build` — see eslint.config.cjs's
      # own comment) closed the two gaps that used to make a strict,
      # no-fix lint run fail on ~10k pre-existing findings. A clean
      # `eslint --fix` pass now reports zero problems.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

  e2e:
    name: E2E tests (full Docker stack, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Same services + same host-mapped ports (15432/5433/16379/8200/4000)
      # that test/setup-env.ts's defaults assume — this is the exact
      # workflow documented there and in README's Quick Start, just run
      # on a GitHub-hosted runner instead of a laptop. `api` itself is
      # deliberately excluded: the e2e suite talks to a Nest app started
      # in-process by Jest/Supertest, not to the containerized api service.
      # Each matrix shard gets its own isolated runner/containers — no
      # state shared between shard 1 and shard 2.
      - name: Start infrastructure (Postgres, Redis, Vault, mock-psp)
        run: |
          docker compose up -d --wait \
            postgres-master postgres-replica redis vault mock-psp

      # `--shard=N/3` (Jest's own built-in sharding, not a hand-maintained
      # file list) splits the ~48 e2e spec files into three roughly equal
      # groups — each matrix job's single Jest worker process now
      # sequentially bootstraps/tears down ~16 Nest apps instead of ~48,
      # cutting both the cumulative heap this GitHub-hosted runner's
      # tighter 2-core/7GB envelope has to carry before
      # HEALTH_CHECK_HEAP_THRESHOLD_BYTES (test/setup-env.ts) gets hit,
      # and the per-job wall-clock time — see
      # test/utils/test-app.ts's createTestApp() for the actual leak fix
      # (stopping orphaned @Cron() jobs on app.close()) this sharding
      # is headroom for, not a replacement for. Widened from 2 to 3
      # shards after host-CPU-contention-driven flakiness (see
      # docs/technical/ci-cd.md's "Parallelizing e2e workers" section)
      # kept surfacing as different random spec files failing each run,
      # never the same one twice — a third shard is a mitigation for
      # less CPU pressure per job, not a fix for a specific failing
      # test, since there wasn't one.
      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v
