name: SDK Package

# Builds and packages each client SDK (sdk/node, sdk/java, sdk/dotnet,
# sdk/python, sdk/rust, sdk/go) into the same artifact format each
# ecosystem's own tooling would produce for a real publish — `npm pack`,
# `mvn package`, `dotnet pack`, `python -m build`, `cargo package` — but
# deliberately stops there. Nothing in this workflow publishes to npm,
# NuGet, Maven Central, PyPI, crates.io, or GitHub Packages; see
# docs/adr/0005-first-party-node-sdk.md and
# docs/adr/0006-multi-language-sdk-parity.md for why publishing is a
# distinct, not-yet-made decision. Each job's own test suite runs first
# — a package built from code that doesn't pass its own tests isn't
# something to keep as an artifact.
on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-package.yml'
  workflow_dispatch: {}

concurrency:
  group: sdk-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Package sdk/node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build
      # `npm pack` builds the exact tarball `npm publish` would upload,
      # without publishing it anywhere.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-node
          path: sdk/node/*.tgz
          if-no-files-found: error

  java:
    name: Package sdk/java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-java
          path: sdk/java/target/*.jar
          if-no-files-found: error

  dotnet:
    name: Package sdk/dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test sdk/dotnet/test/OmniSwitch.Sdk.Tests.csproj
      # `dotnet pack` builds the .nupkg `dotnet nuget push` would upload,
      # without pushing it anywhere.
      - run: dotnet pack sdk/dotnet/src/OmniSwitch.Sdk.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dotnet
          path: sdk/dotnet/src/bin/Release/*.nupkg
          if-no-files-found: error

  python:
    name: Package sdk/python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: pip install -e '.[test]'
      - run: pytest
      # `python -m build` produces the sdist/wheel `twine upload` would
      # push to PyPI, without pushing them anywhere.
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-python
          path: sdk/python/dist/*
          if-no-files-found: error

  rust:
    name: Package sdk/rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      # `cargo package` builds the exact .crate `cargo publish` would
      # upload, without publishing it — doubly guarded by this crate's
      # own `Cargo.toml` also setting `publish = false`.
      - run: cargo package
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-rust
          path: sdk/rust/target/package/*.crate
          if-no-files-found: error

  go:
    name: Package sdk/go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
        working-directory: sdk/go
      - run: go test ./...
        working-directory: sdk/go
      # Go modules are distributed as source via git tags/the module
      # proxy, not a binary package format — a source archive is the
      # closest equivalent artifact for a library with no `main` package.
      - run: tar czf sdk-go.tar.gz -C sdk go
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-go
          path: sdk-go.tar.gz
          if-no-files-found: error
