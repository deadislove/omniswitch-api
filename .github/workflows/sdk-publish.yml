name: SDK Publish (GitHub Packages)

# Publishes sdk/node, sdk/java, and sdk/dotnet to this repo's own
# GitHub Packages registries — never to the public npm/Maven Central/
# NuGet.org registries. Only these three: GitHub Packages has no native
# registry format for Python (PyPI) or Rust (crates.io), and Go modules
# are consumed directly from git tags, needing no separate publish step
# at all (see docs/adr/0007-github-packages-publishing.md for the full
# per-language breakdown).
#
# Deliberately triggered by a version tag, not by every push to main —
# a package publish is a one-way, versioned action (most registries,
# GitHub Packages included, refuse to let you overwrite an already-
# published version), unlike sdk-package.yml's build-artifact-per-push,
# which is disposable by design. Push a tag matching `sdk-v*` (e.g.
# `sdk-v0.1.0`) once the version in each package's own manifest
# (package.json/pom.xml/OmniSwitch.Sdk.csproj) has been bumped to match.
on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read

jobs:
  node:
    name: Publish sdk/node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@deadislove'
      - run: npm ci
      - run: npm test
      - run: npm run build
      # --registry repeated here on the command line itself, even though
      # package.json's publishConfig.registry and setup-node's
      # registry-url above already both say the same thing — this way
      # the destination is visible in this one line, without having to
      # cross-check package.json to confirm this never reaches the
      # public npm registry.
      - run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  java:
    name: Publish sdk/java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Generates ~/.m2/settings.xml with a <server> block for the
          # id "github" (must match pom.xml's <distributionManagement>
          # repository id), authenticated with GITHUB_TOKEN — this is
          # what lets a plain `mvn deploy` push here with no manual
          # settings.xml committed anywhere.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: mvn -B test
      # -DaltDeploymentRepository repeated here on the command line
      # itself, even though pom.xml's <distributionManagement> already
      # says the same thing — same reasoning as npm publish's --registry
      # above: this makes the destination visible in this one line,
      # without cross-checking pom.xml to confirm this never reaches
      # Maven Central (which this project has no Sonatype/GPG credentials
      # for at all — there's no path by which it could, even by mistake).
      - run: mvn -B deploy -DskipTests -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/deadislove/omniswitch-api
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet:
    name: Publish sdk/dotnet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test sdk/dotnet/test/OmniSwitch.Sdk.Tests.csproj
      - run: dotnet pack sdk/dotnet/src/OmniSwitch.Sdk.csproj -c Release
      - name: Add GitHub Packages NuGet source
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/deadislove/index.json"
      # --source github refers to the GitHub Packages URL added in the
      # step above, not the dotnet CLI's own built-in default source
      # (nuget.org) — dotnet nuget push has no implicit fallback to
      # nuget.org once --source is given explicitly, so this cannot
      # reach the public NuGet registry.
      - run: dotnet nuget push "sdk/dotnet/src/bin/Release/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}"
