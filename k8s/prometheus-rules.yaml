# ILLUSTRATIVE EXAMPLE — not applied by any deploy path in this repo, and
# not referenced by deployment.yaml/kustomization. `k8s/` has no
# Prometheus/Alertmanager Deployment of its own — `deployment.yaml`'s
# prometheus.io/* pod annotations only describe a scrape *target*, they
# don't stand up a scraper. This file shows what the same alert rules
# monitoring/alert.rules.yml already runs (and is verified against real
# firing conditions) via docker-compose.yml would look like as a
# PrometheusRule CRD for a cluster that already runs the Prometheus
# Operator (https://prometheus-operator.dev) — not verified against a real
# Operator installation, since this repo has no cluster to test against
# (same posture as external-secrets-example.yaml).
#
# The `groups:` block below is hand-kept in sync with
# monitoring/alert.rules.yml — same alert names/expressions/thresholds,
# just wrapped in the CRD shape a Prometheus Operator's ruleSelector picks
# up automatically instead of a plain rule_files path.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: omniswitch-api-alerts
  namespace: payments
  labels:
    # Match whatever label your in-cluster Prometheus Operator's
    # `ruleSelector` expects — "release: prometheus" is the common default
    # for the kube-prometheus-stack Helm chart, adjust to your install.
    release: prometheus
spec:
  groups:
    - name: omniswitch-payment-gateway
      rules:
        - alert: OmniSwitchApiDown
          expr: up{job="omniswitch-api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 'OmniSwitch API is not responding to Prometheus scrapes'
            description: 'The /metrics endpoint on {{ $labels.instance }} has been unreachable for 1m. See docs/technical/incident-response.md#omniswitchapidown.'

        - alert: PSPCircuitBreakerOpen
          expr: omniswitch_psp_circuit_breaker_state == 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.provider }} circuit breaker has been OPEN for 2+ minutes'
            description: 'New charges are being routed away from {{ $labels.provider }} (or failing entirely, if it was the only available provider for a given currency). See docs/technical/incident-response.md#pspcircuitbreakeropen.'

        - alert: PSPSuccessRateLow
          expr: omniswitch_psp_success_rate_percent < 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.provider }} charge success rate is {{ $value | printf "%.1f" }}%% over the trailing 15m'
            description: 'Below the circuit breaker''s own OPEN threshold, so this is an early warning, not yet an outage. See docs/technical/incident-response.md#pspsuccessratelow.'

        - alert: LedgerOutboxDeadLetters
          expr: omniswitch_ledger_outbox_failed_total > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: '{{ $value }} ledger outbox event(s) dead-lettered as FAILED'
            description: 'Ledger entries exist that never made it to relay after exhausting retries. See docs/technical/incident-response.md#ledgeroutboxdeadletters.'

        - alert: LedgerOutboxBacklogHigh
          expr: omniswitch_ledger_outbox_pending_total > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'Ledger outbox PENDING backlog is {{ $value }}, sustained for 10m'
            description: 'Illustrative threshold — not calibrated against any real production traffic volume, since this repo has none to measure. Tune once a real baseline exists. See docs/technical/incident-response.md#ledgeroutboxbackloghigh.'

        - alert: ReconciliationMismatchFound
          expr: omniswitch_reconciliation_mismatches > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.provider }}''s latest reconciliation run found {{ $value }} mismatch(es)'
            description: 'This system''s ledger and the PSP''s own settlement report disagree. See docs/technical/incident-response.md#reconciliationmismatchfound.'
