apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniswitch-api
  namespace: payments
  labels:
    app: omniswitch-api
    version: "1.0.0"
    component: payment-gateway
    tier: backend
    workload-type: service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omniswitch-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # Zero-downtime rolling update
  template:
    metadata:
      labels:
        app: omniswitch-api
        version: "1.0.0"
        # workload-type: service, vs. workload-type: batch-job on the
        # archiving/deletion/partition-maintenance CronJob pods and the
        # drop-cutover-tables Job pod — lets an operator select
        # `kubectl get pods -n payments -l workload-type=batch-job` to
        # see every one-off/scheduled maintenance pod at once, distinct
        # from this Deployment's traffic-serving replicas. Not part of
        # this Deployment's own selector.matchLabels above (selector is
        # immutable after creation) — purely descriptive.
        workload-type: service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Security Context - run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # Service Account
      serviceAccountName: omniswitch-api-sa

      # Graceful termination
      terminationGracePeriodSeconds: 60

      # Anti-affinity: spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - omniswitch-api
                topologyKey: kubernetes.io/hostname

      containers:
        - name: omniswitch-api
          image: omniswitch/payment-gateway:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # ─── Resource Requests & Limits ──────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # ─── Environment Variables ────────────────────────────────────────
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            # Database from ConfigMap
            - name: DB_MASTER_HOST
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_MASTER_HOST
            # DB_MASTER_PORT/DB_REPLICA_PORT: app.module.ts defaults these
            # independently if unset — DB_MASTER_PORT to 5432 (usually
            # correct by coincidence) but DB_REPLICA_PORT to 5433 (almost
            # never correct, since 5432 is the standard PgBouncer/Postgres
            # port everyone actually uses). Omitting these two means every
            # replica connection attempt hits a port nothing is listening
            # on — an immediate refusal, not a slow timeout — which fails
            # `DataSource.initialize()` as a whole (TypeORM's `replication`
            # mode treats master+replica startup as one unit) and prevents
            # the application from booting at all.
            - name: DB_MASTER_PORT
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_MASTER_PORT
            - name: DB_REPLICA_HOST
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_REPLICA_HOST
            - name: DB_REPLICA_PORT
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_REPLICA_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_NAME
            # Without this, `app.module.ts`'s `config.get('DB_SSL')` reads
            # as unset and silently falls back to `ssl: false` even though
            # this ConfigMap's own DB_SSL value is "true" — TLS to the
            # database would be silently disabled, not fail loudly.
            - name: DB_SSL
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_SSL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: REDIS_PORT
            - name: RATE_LIMIT_MAX
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: RATE_LIMIT_MAX
            # Without this, VaultTransitService falls back to
            # http://localhost:8200 with an empty token — HmacSignatureGuard
            # calls it on every HMAC-signed request (charge, refund,
            # capture, cancel, dispute-evidence), so this is on the
            # money-moving hot path, not just a boot-time nicety.
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: VAULT_ADDR
            # Secrets
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: VAULT_TOKEN
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: JWT_SECRET
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: HMAC_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: STRIPE_SECRET_KEY
            - name: ADYEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: ADYEN_API_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: ADYEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: ADYEN_HMAC_KEY

          # ─── Liveness Probe ───────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ─── Readiness Probe ──────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ─── Startup Probe ────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12  # 60 seconds max startup time

          # ─── Security Context ─────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # ─── Volume Mounts ────────────────────────────────────────────────
          volumeMounts:
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: logs
          emptyDir: {}

      # Image pull secrets (if using private registry)
      # imagePullSecrets:
      #   - name: registry-credentials
