apiVersion: v1
kind: ConfigMap
metadata:
  name: omniswitch-config
  namespace: payments
  labels:
    app: omniswitch-api
data:
  # Application
  NODE_ENV: "production"
  PORT: "3000"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "info"

  # Database — routed through PgBouncer (pgbouncer.yaml), not directly at
  # postgres-master/postgres-replica. At maxReplicas: 20 (hpa.yaml) with
  # extra.max: 20 per pod (app.module.ts), direct connections could reach
  # 400 against a single Postgres instance — see
  # docs/spec/future/database-scaling.md (Option 1).
  DB_MASTER_HOST: "pgbouncer-master.payments.svc.cluster.local"
  DB_MASTER_PORT: "5432"
  DB_REPLICA_HOST: "pgbouncer-replica.payments.svc.cluster.local"
  DB_REPLICA_PORT: "5432"
  DB_NAME: "omniswitch_payments"
  DB_SSL: "true"

  # Real Postgres backends pgbouncer.yaml's two Deployments pool for —
  # wherever the master/replica StatefulSet or managed service actually
  # lives (not defined in this repo). Kept separate from
  # DB_MASTER_HOST/DB_REPLICA_HOST above, which is what the app itself
  # connects to (the pooler), not the real database.
  PGBOUNCER_MASTER_BACKEND_HOST: "postgres-master.payments.svc.cluster.local"
  PGBOUNCER_REPLICA_BACKEND_HOST: "postgres-replica.payments.svc.cluster.local"

  # Redis
  REDIS_HOST: "redis.payments.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Rate Limiting
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_TTL: "60000"

  # Data retention (archiving-cronjob.yaml / deletion-cronjob.yaml) — see
  # docs/spec/future/database-scaling.md Option 3 and
  # docs/compliance/data-retention.md. Deliberately configurable, not
  # hardcoded in the job scripts themselves — AML record-keeping minimums
  # vary by jurisdiction, and this POC needs to be adjustable per
  # deployment without a code change. These two values are the ones a
  # real deployment's compliance/legal review is most likely to change.
  ARCHIVE_THRESHOLD_DAYS: "180"
  DELETION_THRESHOLD_YEARS: "8"
  DELETION_BACKUP_REQUIRED: "true"
  DELETION_BACKUP_PATH: "/app/backups"
  # Separate from the AML thresholds above — how long payments_old/
  # ledger_outbox_old (the partitioning-cutover safety net) are kept
  # before `npm run job:drop-cutover-tables` (a one-time operator script,
  # not a CronJob) will drop them.
  CUTOVER_OLD_TABLE_RETENTION_DAYS: "60"

  # CORS
  CORS_ORIGINS: "https://dashboard.omniswitch.io,https://app.omniswitch.io"

  # PSP Configuration
  ADYEN_MERCHANT_ACCOUNT: "OmniSwitchProd"
  ADYEN_BASE_URL: "https://checkout-live.adyen.com/v71"
