apiVersion: v1
kind: ConfigMap
metadata:
  name: omniswitch-config
  namespace: payments
  labels:
    app: omniswitch-api
data:
  # Application
  NODE_ENV: "production"
  PORT: "3000"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "info"

  # Database
  DB_MASTER_HOST: "postgres-master.payments.svc.cluster.local"
  DB_MASTER_PORT: "5432"
  DB_REPLICA_HOST: "postgres-replica.payments.svc.cluster.local"
  DB_REPLICA_PORT: "5432"
  DB_NAME: "omniswitch_payments"
  DB_SSL: "true"

  # Redis
  REDIS_HOST: "redis.payments.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # Rate Limiting
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_TTL: "60000"

  # CORS
  CORS_ORIGINS: "https://dashboard.omniswitch.io,https://app.omniswitch.io"

  # PSP Configuration
  ADYEN_MERCHANT_ACCOUNT: "OmniSwitchProd"
  ADYEN_BASE_URL: "https://checkout-live.adyen.com/v71"
