# Security headers (X-Frame-Options, CSP, HSTS, etc.) are NOT set via a
# per-Ingress `nginx.ingress.kubernetes.io/configuration-snippet`
# annotation here — verified live against a real ingress-nginx install
# (chart default, no custom values) that this annotation is rejected
# outright by the controller's own admission webhook on a fresh
# `kubectl apply`, before this Ingress is created at all
# (`allowSnippetAnnotations: false` has been the chart default since
# ingress-nginx ~v1.9, a CVE-driven hardening default). Confirmed this
# isn't a simple opt-back-in either: even with that flag temporarily set
# to `true`, this exact snippet content (using the `more_set_headers`
# directive) is separately rejected as a "risky annotation" by a second,
# independent webhook check. There is no supported way to keep this
# annotation and have this Ingress actually deploy against a
# default-configured modern ingress-nginx.
#
# These same 5 headers are instead set via ingress-nginx's
# controller-level `add-headers` global config — see
# `k8s/ingress-nginx-security-headers-configmap.yaml`'s own comment for
# the ConfigMap this assumes exists and the Helm value that wires it in.
# This is coarser-grained (applies to every route this ingress-nginx
# install serves, not just this one Ingress) but is the only mechanism
# that still works, and this repo's own ingress-nginx install is assumed
# dedicated to this one application rather than shared multi-tenant, so
# that broader scope is the correct scope here, not a compromise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniswitch-api-ingress
  namespace: payments
  labels:
    app: omniswitch-api
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # TLS termination
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting at ingress level (backup to app-level)
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Proxy settings for SSE (Server-Sent Events)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Body size for bulk upload
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - api.omniswitch.io
      secretName: omniswitch-tls-cert
  rules:
    - host: api.omniswitch.io
      http:
        paths:
          # API v1 routes
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: omniswitch-api
                port:
                  number: 80
          # Health check (no auth required)
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: omniswitch-api
                port:
                  number: 80
          # Swagger docs (only in non-prod)
          - path: /api/docs
            pathType: Prefix
            backend:
              service:
                name: omniswitch-api
                port:
                  number: 80
