apiVersion: v1
kind: ServiceAccount
metadata:
  name: omniswitch-api-sa
  namespace: payments
  labels:
    app: omniswitch-api
  # A cloud-provider IAM role binding goes here in a real deployment —
  # e.g. AWS IRSA: annotate with eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>,
  # or GKE Workload Identity: iam.gke.io/gcp-service-account: <sa>@<project>.iam.gserviceaccount.com.
  # No placeholder annotation is set here — an empty annotations block,
  # not a fake-looking key, is the honest state until this deployment
  # actually needs one (e.g. reading a secret directly from a cloud
  # secrets manager instead of via External Secrets Operator).
  #
  # This app's own code makes no Kubernetes API calls and needs no RBAC
  # Role/RoleBinding — this ServiceAccount exists purely so the pod runs
  # under its own identity instead of the namespace's `default` one,
  # which is what a cloud IAM binding would need to attach to if one is
  # ever added.
---
# Deliberately no Role/RoleBinding — this ServiceAccount has zero
# Kubernetes API permissions (the default for any ServiceAccount with no
# RoleBinding), which is correct: nothing in this application calls the
# Kubernetes API. If that ever changes, add a narrowly-scoped Role here,
# not a ClusterRole.
