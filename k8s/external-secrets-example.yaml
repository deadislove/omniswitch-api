# ILLUSTRATIVE EXAMPLE — not applied by any deploy path in this repo, and
# not referenced by deployment.yaml/kustomization. Shows the shape of the
# real fix for secret.yaml's own warning ("In production: use External
# Secrets Operator or Sealed Secrets") — see
# docs/technical/secret-management.md#migration-path-for-k8s-level-secrets
# for the full reasoning and why this repo can't verify either path against
# real infrastructure the way every other change in this project is
# verified (no real AWS account / Vault cluster / Sealed Secrets controller
# to test against here).
#
# Requires the External Secrets Operator controller installed in-cluster
# first (https://external-secrets.io) — this file only defines what THIS
# app's secret sync would look like once that's in place.
#
# Same target name/namespace/keys as k8s/secret.yaml — deployment.yaml's
# `secretKeyRef.name: omniswitch-secrets` needs zero changes either way;
# ExternalSecret's whole job is materializing that same Secret object from
# a real backend instead of from a checked-in, base64'd placeholder file.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: omniswitch-secrets-store
  namespace: payments
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # IRSA (IAM Roles for Service Accounts) — the operator assumes this
      # role to read Secrets Manager, no long-lived AWS credentials stored
      # in the cluster at all. Swap this whole `provider` block for
      # `vault`/`gcpsm`/`azurekv`/etc. to target a different backend; the
      # ExternalSecret resource below doesn't change either way.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: omniswitch-secrets-sync
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: omniswitch-secrets-store
    kind: SecretStore
  target:
    name: omniswitch-secrets # same name k8s/secret.yaml uses today
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: omniswitch/prod/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: omniswitch/prod/db
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: omniswitch/prod/redis
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: omniswitch/prod/auth
        property: jwt_secret
    - secretKey: HMAC_SECRET
      remoteRef:
        key: omniswitch/prod/auth
        property: hmac_secret
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: omniswitch/prod/stripe
        property: secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: omniswitch/prod/stripe
        property: webhook_secret
    - secretKey: ADYEN_API_KEY
      remoteRef:
        key: omniswitch/prod/adyen
        property: api_key
    - secretKey: ADYEN_HMAC_KEY
      remoteRef:
        key: omniswitch/prod/adyen
        property: hmac_key
