        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.24.1-p1
          ports:
            - containerPort: 5432
              name: pgbouncer
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: PGBOUNCER_REPLICA_BACKEND_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: omniswitch-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omniswitch-secrets
                  key: DB_PASSWORD
            - name: POOL_MODE
              value: "transaction"
            - name: DEFAULT_POOL_SIZE
              value: "50"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: AUTH_TYPE
              value: "scram-sha-256"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-replica
  namespace: payments
  labels:
    app: pgbouncer-replica
    component: connection-pooler
spec:
  type: ClusterIP
  selector:
    app: pgbouncer-replica
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: 5432
      protocol: TCP
