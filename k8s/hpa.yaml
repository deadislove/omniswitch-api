apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omniswitch-api-hpa
  namespace: payments
  labels:
    app: omniswitch-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omniswitch-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # Scale on CPU utilization > 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on Memory utilization > 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cooldown before scale-down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
